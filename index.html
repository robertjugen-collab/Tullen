<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tullen">
<meta name="theme-color" content="#14324f">
<title>Bussen vid Tullen</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a stop sign at the top, the departure board below, the map last. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#132433; --muted:#5b6b78; --line:#d6dee5;
  --sign:#14324f; --sign-ink:#ffffff; --accent:#d4001e; --ok:#1d7a46; --warn:#b26100;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c151d; --surface:#15212c; --ink:#e6edf2; --muted:#8fa0ad; --line:#253543;
  --sign:#0f2a44; --sign-ink:#ffffff; --accent:#ff4d5e; --ok:#4cc583; --warn:#f0a43c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:16px}
.sign{background:var(--sign);color:var(--sign-ink);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.sign .h{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--sign);display:grid;place-items:center;font:700 26px/1 var(--display);flex:none}
.sign h1{margin:0;font:700 34px/1 var(--display);letter-spacing:.01em}
.sign p{margin:2px 0 0;font-size:14px;opacity:.8}
.sign button{margin-left:auto}
button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.sign button{background:transparent;color:var(--sign-ink);border-color:rgba(255,255,255,.35)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.dep:first-child{border-top:0}
.dep.sel{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.line{font:700 20px/1 var(--display);background:var(--accent);color:#fff;border-radius:8px;padding:6px 8px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.dest{min-width:0}
.dest b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest small{color:var(--muted);font-size:13px}
.time{text-align:right;font-variant-numeric:tabular-nums}
.time b{display:block;font:700 26px/1 var(--display)}
.time small{font-size:12px;color:var(--muted)}
.late{color:var(--warn)} .rt{color:var(--ok)}
.empty{padding:20px 14px;color:var(--muted)}
.dev{font-size:13px;color:var(--warn);margin-top:2px}
h2{font:700 22px/1 var(--display);margin:4px 0 0;letter-spacing:.02em}
#map{height:340px;border-radius:14px;border:1px solid var(--line);z-index:0}
.note{font-size:13px;color:var(--muted)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.settings label{font-size:14px;font-weight:600}
.settings input{font:15px var(--body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.busicon{background:var(--accent);color:#fff;font:700 13px/1 var(--display);border-radius:7px;padding:4px 6px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap}
.stopicon{width:16px;height:16px;border-radius:50%;background:var(--sign);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
</style>
</head>
<body>
<main>
  <header class="sign">
    <div class="h">H</div>
    <div><h1>Tullen</h1><p id="sub">Gottröra · hämtar hållplats…</p></div>
    <button id="refresh" type="button">Uppdatera</button>
  </header>
  <div class="status"><span id="updated">–</span><span id="err"></span></div>

  <section class="board" id="board" aria-live="polite"><div class="empty">Hämtar avgångar från SL…</div></section>

  <h2>Bussen på kartan</h2>
  <div id="map"></div>
  <p class="note" id="mapnote"></p>

  <details class="settings" id="settingsBox">
    <summary><b>Inställningar</b></summary>
    <label for="key">Trafiklab-nyckel (GTFS Regional Realtime)</label>
    <input id="key" type="text" autocomplete="off" placeholder="Klistra in din API-nyckel">
    <label for="lineFilter">Visa bara linjer (t.ex. 677, lämna tomt för alla)</label>
    <input id="lineFilter" type="text" inputmode="numeric" placeholder="677">
    <div class="row"><button id="save" type="button">Spara</button></div>
    <p class="note">Nyckeln sparas bara i den här webbläsaren. Skaffa en gratis på trafiklab.se: skapa ett projekt och lägg till API:t ”GTFS Regional Realtime”.</p>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SL = "https://transport.integration.sl.se/v1";
const GOTTRORA = [59.765, 18.14];       // ungefärligt läge, används för att välja rätt "Tullen"
const store = {
  get(k,d){try{return localStorage.getItem(k) ?? d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch{}}
};
const $ = id => document.getElementById(id);
let site = null, map, stopMarker, busLayer, departures = [];

/* ---------- hållplats ---------- */
function dist(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;
  const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function findSite(){
  const qs = new URLSearchParams(location.search).get("site");
  const cached = store.get("tullenSite");
  if (qs) { site = {id:+qs, name:"Tullen"}; }
  else if (cached) { site = JSON.parse(cached); }
  else {
    const r = await fetch(SL + "/sites?expand=false");
    if (!r.ok) throw new Error("SL svarade " + r.status);
    const all = await r.json();
    const hits = all.filter(s => s.name === "Tullen")
      .map(s => ({id:s.id, name:s.name, note:s.note, lat:s.lat, lon:s.lon, d:dist(GOTTRORA,[s.lat,s.lon])}))
      .sort((a,b)=>a.d-b.d);
    if (!hits.length) throw new Error("Hittade ingen hållplats som heter Tullen");
    site = hits[0];
    store.set("tullenSite", JSON.stringify(site));
  }
  $("sub").textContent = (site.note || "Gottröra") + " · hållplats " + site.id;
}

/* ---------- avgångar ---------- */
function hm(iso){return new Date(iso).toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}
function wanted(){return store.get("lineFilter","").split(/[ ,]+/).filter(Boolean)}
async function loadDepartures(){
  const r = await fetch(`${SL}/sites/${site.id}/departures?forecast=180`);
  if (!r.ok) throw new Error("Avgångar: SL svarade " + r.status);
  const j = await r.json();
  const f = wanted();
  departures = (j.departures||[]).filter(d => !f.length || f.includes(String(d.line?.designation)));
  renderBoard();
}
function renderBoard(){
  const b = $("board");
  if (!departures.length){ b.innerHTML = '<div class="empty">Inga avgångar de närmaste tre timmarna.</div>'; return; }
  b.innerHTML = "";
  for (const d of departures.slice(0,12)){
    const exp = d.expected || d.scheduled, late = Math.round((new Date(exp)-new Date(d.scheduled))/60000);
    const mins = Math.round((new Date(exp)-Date.now())/60000);
    const big = d.state==="CANCELLED" ? "Inställd" : mins<=0 ? "Nu" : mins<60 ? mins+" min" : hm(exp);
    const el = document.createElement("div"); el.className="dep";
    el.innerHTML = `<div class="line"></div><div class="dest"><b></b><small></small><div class="dev"></div></div>
      <div class="time"><b></b><small></small></div>`;
    el.querySelector(".line").textContent = d.line?.designation ?? "?";
    el.querySelector(".dest b").textContent = d.destination;
    el.querySelector(".dest small").textContent = "Läge " + (d.stop_point?.designation || d.stop_point?.name || "–");
    el.querySelector(".dev").textContent = (d.deviations||[]).map(x=>x.message).join(" ");
    const tb = el.querySelector(".time b"); tb.textContent = big;
    const ts = el.querySelector(".time small");
    if (d.state==="CANCELLED"){ tb.className="late"; ts.textContent = "tidtabell " + hm(d.scheduled); }
    else if (d.expected && late>1){ tb.className="late"; ts.textContent = `${late} min sen · ord. ${hm(d.scheduled)}`; }
    else { ts.innerHTML = d.expected && d.journey?.state!=="NOTEXPECTED" ? '<span class="rt">● realtid</span> ' + hm(exp) : "enl. tidtabell " + hm(exp); }
    b.appendChild(el);
  }
}

/* ---------- karta ---------- */
function initMap(){
  map = L.map("map",{zoomControl:true,attributionControl:true}).setView(site.lat?[site.lat,site.lon]:GOTTRORA, 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
  if (site.lat) stopMarker = L.marker([site.lat,site.lon],{icon:L.divIcon({className:"",html:'<div class="stopicon"></div>',iconSize:[16,16]})}).addTo(map).bindPopup("Tullen");
  busLayer = L.layerGroup().addTo(map);
}

/* Minimal protobuf-läsare för GTFS-RT VehiclePositions */
function pb(buf){
  const v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength); let p=0;
  const varint=()=>{let r=0,s=0,b;do{b=buf[p++];r+= (b&0x7f)*2**s;s+=7}while(b&0x80);return r};
  const out={};
  while(p<buf.length){
    const tag=varint(), f=Math.floor(tag/8), w=tag&7; let val;
    if(w===0) val=varint();
    else if(w===1){val=v.getFloat64(p,true);p+=8}
    else if(w===2){const n=varint();val=buf.subarray(p,p+n);p+=n}
    else if(w===5){val=v.getFloat32(p,true);p+=4}
    else break;
    (out[f] ||= []).push(val);
  }
  return out;
}
const str = b => b ? new TextDecoder().decode(b) : "";
function lineFromRoute(routeId){
  const m = /^9011001(\d{4})/.exec(routeId||"");   // Samtrafikens route_id innehåller linjenumret
  return m ? String(parseInt(m[1],10)) : null;
}
async function loadVehicles(){
  const key = store.get("tlKey","");
  if (!key){ $("mapnote").textContent = "Lägg in en Trafiklab-nyckel under Inställningar för att se bussarnas position."; return; }
  const r = await fetch("https://opendata.samtrafiken.se/gtfs-rt/sl/VehiclePositions.pb?key="+encodeURIComponent(key));
  if (!r.ok) throw new Error("Bussposition: Trafiklab svarade " + r.status + (r.status===401||r.status===403?" (kontrollera nyckeln)":""));
  const feed = pb(new Uint8Array(await r.arrayBuffer()));
  const lines = new Set([...wanted(), ...departures.map(d=>String(d.line?.designation))]);
  const center = site.lat?[site.lat,site.lon]:GOTTRORA;
  busLayer.clearLayers(); let n=0;
  for (const e of feed[2]||[]){
    const ent = pb(e); if(!ent[4]) continue;
    const vp = pb(ent[4][0]); if(!vp[2]) continue;
    const pos = pb(vp[2][0]); const lat=pos[1]?.[0], lon=pos[2]?.[0]; if(lat==null) continue;
    const trip = vp[1]?pb(vp[1][0]):{};
    const routeId = str(trip[5]?.[0]), tripId = str(trip[1]?.[0]);
    const veh = vp[8]?pb(vp[8][0]):{}; const vehId = str(veh[1]?.[0]), vehLabel = str(veh[2]?.[0]);
    const line = lineFromRoute(routeId);
    const km = dist(center,[lat,lon]);
    // Känd linje: visa om den går från Tullen och är inom 40 km. Okänd linje: visa bara bussar inom 10 km.
    if (line ? (!lines.has(line) || km > 40) : km > 10) continue;
    const ts = vp[5]?.[0]; const age = ts ? Math.round(Date.now()/1000 - ts) : null;
    const pop = document.createElement("div");
    pop.textContent = `${line ? "Linje " + line : "Buss"} · ${km.toFixed(1)} km från Tullen`
      + (age!=null ? ` · position för ${age} s sedan` : "");
    const ids = document.createElement("small");
    ids.style.cssText = "display:block;margin-top:4px;opacity:.7;word-break:break-all";
    ids.textContent = `tur: ${tripId||"–"} · linje-id: ${routeId||"–"} · fordon: ${vehLabel||vehId||"–"}`;
    pop.appendChild(ids);
    L.marker([lat,lon],{icon:L.divIcon({className:"",html:`<div class="busicon">${line||"Buss"}</div>`,iconSize:null})})
      .bindPopup(pop).addTo(busLayer);
    n++;
  }
  $("mapnote").textContent = n ? `${n} buss${n>1?"ar":""} inom 10 km från Tullen. Tryck på en buss för detaljer. Uppdateras var 15:e sekund.` : "Inga bussar inom 10 km från Tullen just nu.";
}

/* ---------- loop ---------- */
async function tick(){
  $("err").textContent = "";
  try { await loadDepartures(); } catch(e){ $("err").textContent = e.message; }
  try { await loadVehicles(); } catch(e){ $("mapnote").textContent = e.message; }
  $("updated").textContent = "Uppdaterad " + new Date().toLocaleTimeString("sv-SE");
}
$("refresh").onclick = tick;
$("key").value = store.get("tlKey","");
$("lineFilter").value = store.get("lineFilter","");
$("save").onclick = () => { store.set("tlKey",$("key").value.trim()); store.set("lineFilter",$("lineFilter").value.trim()); $("settingsBox").open=false; tick(); };
setInterval(()=>{ if(!document.hidden && departures.length) renderBoard(); }, 20000);
setInterval(()=>{ if(!document.hidden) tick(); }, 15000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });

(async()=>{
  try { await findSite(); } catch(e){ $("err").textContent = e.message; $("board").innerHTML='<div class="empty">Kunde inte nå SL. Kontrollera nätet och tryck Uppdatera.</div>'; return; }
  initMap(); tick();
})();
</script>
</body>
</html>
